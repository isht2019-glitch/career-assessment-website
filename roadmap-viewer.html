<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI Career Roadmap Generator</title>
    <!-- AI-Powered Roadmap Generation - No static database needed -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .roadmap-content {
            line-height: 1.8;
            color: #333;
        }

        .roadmap-content pre {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .error {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            color: #856404;
        }

        .success {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            color: #155724;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .load-more-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin: 20px auto;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .load-more-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Career Roadmap</h1>
            <p id="occupationName">Loading...</p>
        </div>

        <div id="roadmapContent" class="roadmap-content">
            <p style="text-align: center; color: #999;">Loading roadmap...</p>
        </div>

        <div style="text-align: center;">
            <button class="back-btn" onclick="window.close()">← Back to Results</button>
        </div>
    </div>

    <script>
        // AI-Powered Roadmap Generator using Google Gemini API (FREE)
        // Get your FREE API key from: https://makersuite.google.com/app/apikey
        const GEMINI_API_KEY = 'AIzaSyAgkLm9NEBiNJvsdw1JpYJRpS8A-B3-xt8'; // Gemini API key
        let fullRoadmap = '';
        let isComprehensiveMode = false;
        
        async function generateAIRoadmap(occupationName) {
            const prompt = `Generate a DETAILED 12-PHASE career roadmap for: ${occupationName}

Create a comprehensive, structured roadmap with these EXACT 12 phases:

**Phase 1: Career Overview**
- What is this career?
- Key responsibilities
- Why pursue this career?

**Phase 2: Education Requirements**
- Required degrees/certifications
- Recommended institutions/programs in India and internationally
- Typical duration

**Phase 3: Essential Skills (Technical)**
- Core technical skills
- Tools and software
- Industry-specific knowledge

**Phase 4: Essential Skills (Soft Skills)**
- Communication
- Leadership
- Problem-solving
- Teamwork

**Phase 5: Entry-Level Preparation**
- Internships/apprenticeships
- Entry-level certifications
- Portfolio/projects needed

**Phase 6: Entry-Level Positions**
- Job titles
- Typical responsibilities
- Salary range (INR for India)
- Timeline to reach

**Phase 7: Mid-Career Development**
- Advancement opportunities
- Additional certifications
- Specializations available

**Phase 8: Mid-Career Positions**
- Senior/specialist roles
- Increased responsibilities
- Salary range (INR for India)
- Years of experience needed

**Phase 9: Advanced Skills & Leadership**
- Management skills
- Strategic thinking
- Industry expertise

**Phase 10: Senior/Leadership Positions**
- Executive roles
- Consulting opportunities
- Salary range (INR for India)

**Phase 11: Industry Outlook & Trends**
- Job market growth in India
- Future demand
- Emerging opportunities
- Industry changes

**Phase 12: Getting Started Today**
- First steps (this month)
- Resources and platforms
- Networking groups
- Recommended learning paths

IMPORTANT: 
- Only include relevant career information
- Do NOT include math problems, width/length/dimensions, geometry, or unrelated material
- Do NOT include any CSS, HTML, or code snippets
- Use clear formatting with bullet points
- Provide realistic salary ranges in INR
- Make it specific to ${occupationName}, not generic
- Keep each phase concise but detailed
- Be HONEST about challenges and uncertainties
- Format as plain text with markdown (**, #, ##, ###, -)
- NO style tags, NO HTML tags, NO code blocks`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    mode: 'cors',
                    cache: 'no-cache',
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 4096,
                        },
                        safetySettings: [
                            {
                                category: "HARM_CATEGORY_HARASSMENT",
                                threshold: "BLOCK_NONE"
                            },
                            {
                                category: "HARM_CATEGORY_HATE_SPEECH",
                                threshold: "BLOCK_NONE"
                            },
                            {
                                category: "HARM_CATEGORY_SEXUALLY_EXPLICIT",
                                threshold: "BLOCK_NONE"
                            },
                            {
                                category: "HARM_CATEGORY_DANGEROUS_CONTENT",
                                threshold: "BLOCK_NONE"
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                console.log('API Response:', data);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${data.error?.message || 'Unknown error'}`);
                }
                
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    console.error('Unexpected API response:', data);
                    throw new Error(`Invalid response from AI: ${JSON.stringify(data)}`);
                }
            } catch (error) {
                console.error('AI Generation Error:', error);
                throw error;
            }
        }

        // Wait for page to fully load
        window.addEventListener('load', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            const occupationName = urlParams.get('name') || slug;

            console.log('🎯 AI Roadmap Generator loaded');
            console.log('📝 Occupation:', occupationName);
            
            // Show occupation name
            if (!occupationName) {
                document.getElementById('occupationName').innerHTML = '<span style="color: red;">ERROR: No occupation provided</span>';
                document.getElementById('roadmapContent').innerHTML = `
                    <div class="error">
                        <h3>❌ Error: No Occupation Selected</h3>
                        <p>Please select an occupation from the dropdown menu.</p>
                    </div>
                `;
                return;
            }

            document.getElementById('occupationName').textContent = occupationName;
            
            // Check if API key is set
            if (!GEMINI_API_KEY || GEMINI_API_KEY === 'YOUR_API_KEY_HERE') {
                document.getElementById('roadmapContent').innerHTML = `
                    <div class="error">
                        <h3>⚙️ API Key Required</h3>
                        <p>To use AI-powered roadmap generation, you need a FREE Google Gemini API key.</p>
                        
                        <h4 style="margin-top: 20px;">📝 How to get your FREE API key:</h4>
                        <ol style="margin-left: 20px; margin-top: 10px; line-height: 1.8;">
                            <li>Go to: <a href="https://makersuite.google.com/app/apikey" target="_blank" style="color: #667eea; font-weight: bold;">Google AI Studio</a></li>
                            <li>Sign in with your Google account</li>
                            <li>Click "Create API Key"</li>
                            <li>Copy the API key</li>
                            <li>Open <code>roadmap-viewer.html</code> and replace <code>YOUR_API_KEY_HERE</code> with your key</li>
                        </ol>
                        
                        <p style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
                            <strong>💡 Note:</strong> The API is completely FREE with generous limits (60 requests/minute).
                            No credit card required!
                        </p>
                    </div>
                `;
                return;
            }
            
            // Show loading state
            document.getElementById('roadmapContent').innerHTML = `
                <div class="success">
                    <h3>🤖 Generating AI-Powered Roadmap...</h3>
                    <p>Creating a personalized, detailed career roadmap for <strong>${occupationName}</strong></p>
                    <p style="margin-top: 10px;">⏳ This may take 10-20 seconds...</p>
                </div>
            `;

            try {
                // Generate roadmap using AI
                const roadmap = await generateAIRoadmap(occupationName);
                fullRoadmap = roadmap;
                isComprehensiveMode = false;
                
                // Show summary version first (2000 characters)
                const summaryRoadmap = roadmap.length > 2000 ? roadmap.substring(0, 2000) + '...' : roadmap;
                
                document.getElementById('roadmapContent').innerHTML = `
                    <div class="success">
                        <strong>✅ AI-Generated Roadmap (2025)</strong><br>
                        Personalized career guidance powered by Google Gemini AI
                    </div>
                    <pre style="white-space: pre-wrap; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.6;" id="roadmapText">${summaryRoadmap}</pre>
                    <div class="button-container">
                        <button class="load-more-btn" onclick="toggleComprehensiveMode()">📖 Load More</button>
                    </div>
                `;
                
                console.log('✅ AI Roadmap generated successfully');
            } catch (error) {
                console.error('❌ Failed to generate roadmap:', error);
                
                let errorDetails = error.message;
                let troubleshooting = '';
                
                if (errorDetails.includes('API_KEY_INVALID') || errorDetails.includes('404')) {
                    troubleshooting = `
                        <h4 style="margin-top: 15px;">🔧 Possible Solutions:</h4>
                        <ol style="margin-left: 20px; margin-top: 10px; line-height: 1.8;">
                            <li><strong>Enable the API:</strong>
                                <br>Go to <a href="https://console.cloud.google.com/apis/library/generativelanguage.googleapis.com" target="_blank" style="color: #667eea;">Google Cloud Console</a>
                                <br>Click "ENABLE" for Generative Language API
                            </li>
                            <li><strong>Check API Key:</strong>
                                <br>Go to <a href="https://makersuite.google.com/app/apikey" target="_blank" style="color: #667eea;">Google AI Studio</a>
                                <br>Verify your API key is active
                            </li>
                            <li><strong>Disable Ad Blocker:</strong>
                                <br>Ad blockers may block API requests
                                <br>Try disabling it for this site
                            </li>
                            <li><strong>Check Restrictions:</strong>
                                <br>Go to <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color: #667eea;">API Credentials</a>
                                <br>Make sure there are no domain restrictions
                            </li>
                        </ol>
                    `;
                } else if (errorDetails.includes('quota') || errorDetails.includes('limit')) {
                    troubleshooting = `
                        <h4 style="margin-top: 15px;">🔧 Troubleshooting:</h4>
                        <p>You may have exceeded the API quota. The free tier allows:</p>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            <li>60 requests per minute</li>
                            <li>1,500 requests per day</li>
                        </ul>
                        <p style="margin-top: 10px;">Please wait a few minutes and try again.</p>
                    `;
                } else if (errorDetails.includes('BLOCKED') || errorDetails.includes('CORS')) {
                    troubleshooting = `
                        <h4 style="margin-top: 15px;">🔧 Troubleshooting:</h4>
                        <p>The request was blocked. This could be due to:</p>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            <li><strong>Ad Blocker:</strong> Disable ad blocker for this site</li>
                            <li><strong>Browser Extension:</strong> Try in incognito mode</li>
                            <li><strong>API Not Enabled:</strong> Enable Generative Language API in Google Cloud Console</li>
                        </ul>
                    `;
                }
                
                document.getElementById('roadmapContent').innerHTML = `
                    <div class="error">
                        <h3>❌ Failed to Generate Roadmap</h3>
                        <p>Sorry, we couldn't generate the AI roadmap at this time.</p>
                        <p style="margin-top: 10px;"><strong>Error:</strong> ${errorDetails}</p>
                        ${troubleshooting}
                        <p style="margin-top: 15px;">
                            <strong>Debug Info:</strong><br>
                            Check browser console (F12) for detailed error logs.
                        </p>
                    </div>
                `;
            }
        });

        function toggleComprehensiveMode() {
            isComprehensiveMode = !isComprehensiveMode;
            
            const displayText = isComprehensiveMode ? fullRoadmap : (fullRoadmap.length > 2000 ? fullRoadmap.substring(0, 2000) + '...' : fullRoadmap);
            
            document.getElementById('roadmapText').textContent = displayText;
            
            const btn = document.querySelector('.load-more-btn');
            if (btn) {
                btn.textContent = isComprehensiveMode ? '📖 Show Less' : '📖 Load More';
            }
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
